[project]
name = "status-backend"
version = "0.1.0"
description = "Self-hosted status page backend: HTTP monitoring API (FastAPI + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
status-page-backend = "status_backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
